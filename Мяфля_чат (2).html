<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мяфля · Тесса</title>
<style>
:root{--bg:#15101f;--side:#1c1529;--panel:#221a31;--card:#2a2040;--line:#3a2e55;--ink:#f1eaff;--muted:#a898c4;--acc:#ffb86b;--acc2:#ff8fb1;--me:#3b2b5c;--ok:#7fd8a0;--bad:#ff7b8a;--r:14px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;height:100dvh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:700;font-size:17px}
.brand i{font-style:normal;font-size:24px}
.newc{margin:6px 12px 10px;padding:10px;border-radius:12px;border:1px dashed var(--line);background:none;text-align:left}
.newc:hover{border-color:var(--acc)}
.clist{flex:1;overflow:auto;padding:0 8px 8px;display:grid;gap:2px;align-content:start}
.ci{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;border:0;background:none;text-align:left;width:100%;color:var(--muted)}
.ci span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci[aria-current=true]{background:var(--card);color:var(--ink)}
.ci .del{opacity:0;border:0;background:none;color:var(--muted);padding:0 4px}
.ci:hover .del{opacity:.8}
.sfoot{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:6px}
.sfoot button{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:none;text-align:left}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(21,16,31,.85);backdrop-filter:blur(8px)}
header h1{flex:1;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:none;font-size:20px;padding:4px 8px;border-radius:8px}
.ib:hover{background:var(--card)}
#menu{display:none}
.msgs{flex:1;overflow:auto;padding:18px 16px 8px}
.inner{max-width:820px;margin:0 auto;display:grid;gap:14px}
.m{display:grid;gap:6px}
.m.me{justify-items:end}
.b{max-width:100%;padding:11px 15px;border-radius:var(--r);overflow-wrap:anywhere}
.me .b{background:var(--me);border-bottom-right-radius:4px;max-width:85%;white-space:pre-wrap}
.ai .b{background:transparent;padding:4px 2px}
.ai .who{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.b p{margin:.45em 0}.b p:first-child{margin-top:0}.b p:last-child{margin-bottom:0}
.b h1,.b h2,.b h3{margin:.8em 0 .3em;font-size:1.08em}
.b ul,.b ol{margin:.4em 0;padding-left:1.4em}
.b blockquote{margin:.5em 0;padding:.3em .9em;border-left:3px solid var(--acc2);color:var(--muted)}
.b a{color:var(--acc)}
.b code{background:var(--card);padding:1px 6px;border-radius:6px;font:13.5px ui-monospace,Consolas,monospace}
.pre{position:relative;margin:.6em 0}
.pre pre{margin:0;background:#0f0b17;border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:auto;font:13px/1.5 ui-monospace,Consolas,monospace;max-height:420px}
.pre .cp{position:absolute;top:6px;right:6px;font-size:12px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.file{margin:.7em 0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.fh{display:flex;align-items:center;gap:10px;padding:11px 13px}
.fh .fi{font-size:24px}
.fh .fn{flex:1;min-width:0}.fh .fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fh .fn small{color:var(--muted)}
.fh button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13.5px}
.fh button.pri{background:var(--acc);border-color:var(--acc);color:#2a1630;font-weight:600}
.file iframe{display:block;width:100%;height:420px;border:0;border-top:1px solid var(--line);background:#fff}
.file.writing .fh small::after{content:" · пишу…";color:var(--acc)}
.atts{display:flex;flex-wrap:wrap;gap:6px}
.att{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:10px;background:var(--card);font-size:13px;max-width:240px}
.att img{width:36px;height:36px;object-fit:cover;border-radius:6px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{border:0;background:none;color:var(--muted)}
.tools{display:flex;gap:4px;opacity:.7}
.tools button{border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 6px;border-radius:6px}
.tools button:hover{background:var(--card)}
.err{color:var(--bad);font-size:14px;background:rgba(255,123,138,.08);border:1px solid rgba(255,123,138,.3);padding:10px 12px;border-radius:12px;white-space:pre-wrap}
.dots::after{content:"●●●";letter-spacing:3px;color:var(--muted);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.3}}
.empty{text-align:center;color:var(--muted);padding:9vh 10px 0}
.empty .cat{font-size:54px}
.empty h2{color:var(--ink);margin:.3em 0}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.sugg button{padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.comp{padding:10px 16px calc(12px + env(safe-area-inset-bottom));}
.cbox{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px;display:grid;gap:6px}
.cbox:focus-within{border-color:#5a4683}
.crow{display:flex;align-items:flex-end;gap:6px}
#inp{flex:1;resize:none;border:0;background:none;outline:none;padding:8px 6px;max-height:220px;min-height:40px}
#send{width:42px;height:42px;border-radius:50%;border:0;background:var(--acc);color:#2a1630;font-size:18px;font-weight:700;flex:none}
#send.stop{background:var(--acc2)}
#send:disabled{opacity:.4}
.hint{max-width:820px;margin:6px auto 0;font-size:12px;color:var(--muted);text-align:center}
.mdl{position:fixed;inset:0;background:rgba(8,5,14,.7);display:grid;place-items:center;padding:14px;z-index:20}
.mdl[hidden]{display:none}
.mb{width:min(620px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px}
.mb h2{margin:0;font-size:20px}
.fld{display:grid;gap:5px}.fld>span{font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.fld textarea{resize:vertical;min-height:90px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#2a1630;font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
#tst{font-size:13.5px}
details.adv summary{cursor:pointer;color:var(--muted);font-size:14px}
details.adv[open]{display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-size:14px;z-index:30}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 25% 0 0;z-index:15;transform:translateX(-102%);transition:transform .2s;box-shadow:20px 0 60px rgba(0,0,0,.5)}aside.open{transform:none}#menu{display:block}.row2{grid-template-columns:1fr}.msgs{padding:14px 12px 6px}.comp{padding:8px 10px calc(10px + env(safe-area-inset-bottom))}.me .b{max-width:92%}.fh{flex-wrap:wrap}.fh .fn{flex:1 1 calc(100% - 44px)}.fh button{flex:1}}
</style></head><body>
<div class="app">
<aside id="side">
  <div class="brand"><i>🐾</i>Мяфля · Тесса</div>
  <button class="newc" id="newc">＋ Новый чат</button>
  <div class="clist" id="clist"></div>
  <div class="sfoot"><button id="openSet">⚙ Настройки и ключ</button><button id="bk">💾 Сохранить все чаты в файл</button><button id="rs">📂 Загрузить чаты из файла</button><input type="file" id="rsf" accept=".json" hidden></div>
</aside>
<main>
  <header><button class="ib" id="menu" aria-label="Чаты">☰</button><h1 id="ttl">Новый чат</h1><button class="ib" id="gear" title="Настройки">⚙</button></header>
  <div class="msgs" id="msgs"><div class="inner" id="inner"></div></div>
  <div class="comp">
    <div class="cbox">
      <div class="atts" id="atts"></div>
      <div class="crow"><button class="ib" id="clip" title="Приложить файл или картинку">📎</button><input type="file" id="fileIn" multiple hidden><textarea id="inp" rows="1" placeholder="Напиши сообщение…"></textarea><button id="send" title="Отправить">↑</button></div>
    </div>
    <div class="hint" id="hint">Enter — отправить · Shift+Enter — новая строка</div>
  </div>
</main>
</div>

<div class="mdl" id="setM" hidden><div class="mb">
  <h2>Настройки</h2>
  <div class="note">Ключ хранится только в этом браузере, на этом компьютере. Файл можно спокойно копировать: ключ в него не попадает.</div>
  <label class="fld"><span>Сервис</span><select id="prov"><option value="https://api.openai.com/v1">OpenAI</option><option value="https://openrouter.ai/api/v1">OpenRouter</option><option value="https://api.deepseek.com/v1">DeepSeek</option><option value="custom">Другой (свой адрес)</option></select></label>
  <label class="fld" id="urlF"><span>Адрес API (заканчивается на /v1)</span><input id="url" placeholder="https://…/v1"></label>
  <label class="fld"><span>Ключ</span><input id="key" type="password" placeholder="sk-…" autocomplete="off"></label>
  <div class="row2"><label class="fld"><span>Модель</span><input id="model" list="mlist" placeholder="напр. gpt-4o"><datalist id="mlist"></datalist></label>
  <label class="fld"><span>Креативность: <b id="tv">0.7</b></span><input id="temp" type="range" min="0" max="1.2" step="0.1" value="0.7"></label></div>
  <div class="mfoot" style="justify-content:flex-start"><button class="btn" id="test">Проверить подключение</button><span id="tst"></span></div>
  <details class="adv"><summary>О тебе и характер ассистента</summary>
    <label class="fld"><span>Имя ассистента</span><input id="aname" placeholder="Тесса"></label>
    <label class="fld"><span>Как к тебе обращаться</span><input id="uname" placeholder="Вика"></label>
    <label class="fld"><span>О себе (ассистент будет это помнить в каждом чате)</span><textarea id="about"></textarea></label>
    <label class="fld"><span>Характер ассистента</span><textarea id="persona" style="min-height:180px"></textarea></label>
    <div class="mfoot" style="justify-content:flex-start"><button class="btn" id="resetP">Вернуть характер по умолчанию</button></div>
  </details>
  <div class="mfoot"><button class="btn" id="setX">Закрыть</button><button class="btn pri" id="setS">Сохранить</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

/* ---------- характер по умолчанию ---------- */
const PERSONA=`Тебя зовут Тесса. Ты — тёплый, умный и честный помощник и подружка, с которой весело. Общаешься по-русски, живо и просто, как близкий друг, который заодно отлично разбирается в коде, текстах и жизни.

Как ты общаешься:
- Пиши естественно, без канцелярита и без пустых фраз вроде «понимаю ваши чувства», «отличный вопрос», «надеюсь, это поможет».
- Обращайся на «ты». Можно немного юмора, но по делу.
- Будь честным: если чего-то не знаешь или не уверен — так и скажи. Не выдумывай факты, цифры и новости. Если вопрос про свежие события — предупреди, что твои знания могут быть устаревшими.
- Если тебе кажется, что идея неудачная или есть риск — мягко скажи об этом и предложи вариант лучше. Не поддакивай ради приятного.
- Когда человеку грустно — поддержи по-человечески, без сюсюканья и без нравоучений. Не обесценивай. Если тяжесть длится долго — бережно предложи поговорить с близкими или специалистом.
- В обычном разговоре отвечай коротко и по-человечески, без заголовков и списков. Списки — только когда это правда удобнее (шаги, сравнение).

Когда просят что-то сделать:
- Сначала одной фразой скажи, что сделаешь, и сразу делай. Не спрашивай разрешения на очевидное. Уточняющий вопрос — только если без него точно получится не то.
- Делай качественно и до конца: рабочий код, полный текст, без заглушек.
- Код и страницы присылай файлами (формат ниже). Страницы делай красивыми и аккуратными, удобными на телефоне.
- В конце — одна-две строки: что получилось и как этим пользоваться. Без длинных пересказов.`;
const FILE_RULES=`

ФАЙЛЫ. Ты умеешь присылать файлы: интерфейс превращает специальный блок в кнопку «Скачать», а HTML-страницы — ещё и в кнопку «Открыть». Каждый файл оформляй отдельным блоком строго так (три обратные кавычки, слово file, двоеточие, имя файла):
\`\`\`file:имя_файла.расширение
полное содержимое файла
\`\`\`
Правила: файл пиши ЦЕЛИКОМ, никогда не сокращай («…остальное без изменений» запрещено). HTML — один самодостаточный файл, CSS и JS внутри, без внешних зависимостей, если можно обойтись. Подходит любой текстовый формат: .html .txt .md .csv .json .js .py .css .svg и т.д. Короткие примеры кода (несколько строк) можно давать обычным блоком кода. Пользователь тоже может прикладывать файлы — их содержимое придёт в сообщении.`;
const DEF={aname:'Тесса',url:'https://api.openai.com/v1',key:'',model:'',temp:0.7,uname:'Вика',about:'Меня зовут Вика. Люблю котиков, делаю пресеты и виджеты для ролевых чатов (Tavo), работаю в онлайн-поддержке.',persona:PERSONA};
let CFG=Object.assign({},DEF,LS.get('mf_cfg',{}));
const MODELS={'https://api.openai.com/v1':['gpt-4o','gpt-4o-mini','gpt-4.1','gpt-4.1-mini'],'https://openrouter.ai/api/v1':['openai/gpt-4o','deepseek/deepseek-chat','google/gemini-2.5-flash'],'https://api.deepseek.com/v1':['deepseek-chat','deepseek-reasoner']};

/* ---------- чаты ---------- */
let CH=LS.get('mf_chats',[]);let CUR=LS.get('mf_cur',null);
if(!CH.find(c=>c.id===CUR))CUR=CH[0]?CH[0].id:null;
const cur=()=>CH.find(c=>c.id===CUR);
function save(){const slim=CH.map(c=>({...c,msgs:c.msgs.map(m=>({...m,files:(m.files||[]).map(f=>f.kind==='img'?{name:f.name,kind:'img',type:f.type,data:null}:f)}))}));
  if(!LS.set('mf_chats',slim)){/* переполнение — удаляем текстовые вложения старых чатов */const s2=slim.map(c=>({...c,msgs:c.msgs.map(m=>({...m,files:(m.files||[]).map(f=>({name:f.name,kind:f.kind,data:null}))}))}));if(!LS.set('mf_chats',s2))toast('Память браузера заполнена — сохрани чаты в файл и удали старые');}
  LS.set('mf_cur',CUR);}
function newChat(){const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'Новый чат',msgs:[],ts:Date.now()};CH.unshift(c);CUR=c.id;save();drawList();drawMsgs();$('inp').focus();closeSide();}
function drawList(){$('clist').innerHTML=CH.map(c=>`<button class="ci" data-id="${c.id}" aria-current="${c.id===CUR}"><span>${esc(c.title)}</span><b class="del" data-del="${c.id}" title="Удалить">✕</b></button>`).join('')||'<div style="color:var(--muted);font-size:13px;padding:8px 10px">Чатов пока нет</div>';const c=cur();$('ttl').textContent=c?c.title:'Новый чат';}
$('clist').onclick=e=>{const d=e.target.closest('[data-del]');if(d){e.stopPropagation();const c=CH.find(x=>x.id===d.dataset.del);if(c&&confirm('Удалить чат «'+c.title+'»?')){CH=CH.filter(x=>x!==c);if(CUR===c.id)CUR=CH[0]?CH[0].id:null;save();drawList();drawMsgs();}return}
  const b=e.target.closest('.ci');if(b){CUR=b.dataset.id;save();drawList();drawMsgs();closeSide();}};
$('newc').onclick=newChat;

/* ---------- markdown ---------- */
const ICON={html:'🌐',htm:'🌐',js:'📜',py:'🐍',css:'🎨',json:'🧾',csv:'📊',md:'📝',txt:'📄',svg:'🖼'};
const FILES=new Map();let FID=0;
function inline(t){t=esc(t);
  t=t.replace(/`([^`\n]+)`/g,(m,a)=>`<code>${a}</code>`);
  t=t.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  t=t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;}
function block(txt){const L=txt.split('\n');let h='',list=null;
  const close=()=>{if(list){h+=`</${list}>`;list=null}};
  let para=[];const flush=()=>{if(para.length){h+='<p>'+para.map(inline).join('<br>')+'</p>';para=[]}};
  for(const raw of L){const l=raw.trimEnd();let m;
    if(!l.trim()){flush();close();continue}
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flush();close();h+=`<h${m[1].length+1}>${inline(m[2])}</h${m[1].length+1}>`;continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){flush();if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flush();if(list!=='ol'){close();h+='<ol>';list='ol'}h+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^>\s?(.*)/)){flush();close();h+=`<blockquote>${inline(m[1])}</blockquote>`;continue}
    close();para.push(l);}
  flush();close();return h;}
function md(src,live){let out='',i=0;const re=/```([^\n`]*)\n([\s\S]*?)(```|$)/g;let m;
  while(m=re.exec(src)){out+=block(src.slice(i,m.index));i=re.lastIndex;
    const lang=m[1].trim(),body=m[2],done=m[3]==='```';
    const fm=lang.match(/^file:\s*(.+)$/i);
    if(fm){const name=fm[1].trim().replace(/[\\/:*?"<>|]+/g,'_')||'file.txt';const ext=(name.split('.').pop()||'').toLowerCase();const id='f'+(++FID);FILES.set(id,{name,body,ext});
      const kb=(new Blob([body]).size/1024);
      out+=`<div class="file${done?'':' writing'}" data-f="${id}"><div class="fh"><span class="fi">${ICON[ext]||'📎'}</span><span class="fn"><b>${esc(name)}</b><small>${kb<1?'<1':kb.toFixed(kb<10?1:0)} КБ</small></span>${done?`${/^(html?|svg)$/.test(ext)?'<button data-a="view">Превью</button><button data-a="open">Открыть</button>':'<button data-a="copy">Копировать</button>'}<button class="pri" data-a="dl">Скачать</button>`:''}</div></div>`;}
    else{const id='f'+(++FID);FILES.set(id,{name:'code.txt',body});out+=`<div class="pre" data-f="${id}"><pre>${esc(body)}</pre>${done?'<button class="cp" data-a="copy">Копировать</button>':''}</div>`;}}
  out+=block(src.slice(i));return out;}
const MIME={html:'text/html',htm:'text/html',svg:'image/svg+xml',json:'application/json',csv:'text/csv',js:'text/javascript',css:'text/css',md:'text/markdown'};
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Скопировано')}
$('inner').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='msgcopy'){copyText(cur().msgs[+b.dataset.i].content);return}if(a==='regen'){regen();return}
  const box=b.closest('[data-f]');const f=box&&FILES.get(box.dataset.f);
  if(a==='copy'&&f)return copyText(f.body);
  if(!f)return;const blob=new Blob([f.ext==='csv'?'﻿'+f.body:f.body],{type:(MIME[f.ext]||'text/plain')+';charset=utf-8'});
  if(a==='dl'){const u=URL.createObjectURL(blob);const x=document.createElement('a');x.href=u;x.download=f.name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
  if(a==='open'){const u=URL.createObjectURL(blob);const w=window.open(u,'_blank');if(!w)toast('Браузер заблокировал окно — нажми «Скачать»');}
  if(a==='view'){let fr=box.querySelector('iframe');if(fr){fr.remove();b.textContent='Превью';return}fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-scripts allow-forms allow-modals');fr.srcdoc=f.body;box.appendChild(fr);b.textContent='Скрыть';}
});

/* ---------- сообщения ---------- */
function attHtml(files){return files&&files.length?`<div class="atts">${files.map(f=>`<span class="att">${f.kind==='img'&&f.data?`<img src="${f.data}" alt="">`:f.kind==='img'?'🖼':'📄'}<span>${esc(f.name)}</span></span>`).join('')}</div>`:''}
function msgHtml(m,i,last){if(m.role==='user')return `<div class="m me">${attHtml(m.files)}${m.content?`<div class="b">${esc(m.content)}</div>`:''}</div>`;
  return `<div class="m ai"><div class="who">🐾 ${esc(CFG.aname||'Тесса')}</div><div class="b">${m.err?`<div class="err">${esc(m.err)}</div>`:md(m.content||'')}</div><div class="tools"><button data-a="msgcopy" data-i="${i}">Копировать</button>${last?'<button data-a="regen">↻ Ещё вариант</button>':''}</div></div>`;}
function drawMsgs(){FILES.clear();const c=cur();
  if(!c||!c.msgs.length){$('inner').innerHTML=`<div class="empty"><div class="cat">🐱</div><h2>Привет${CFG.uname?', '+esc(CFG.uname):''}!</h2><div>${CFG.key?'Это '+esc(CFG.aname||'Тесса')+'. О чём поболтаем или что сделаем?':'Сначала открой ⚙ Настройки и вставь ключ.'}</div><div class="sugg">${['Сделай мне милую HTML-страничку с котиком','Давай просто поболтаем','Помоги написать сообщение','Сделай игру в браузере'].map(s=>`<button data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;drawList();return}
  const n=c.msgs.length;$('inner').innerHTML=c.msgs.map((m,i)=>msgHtml(m,i,i===n-1&&m.role==='assistant')).join('');drawList();scrollEnd(true);}
$('inner').addEventListener('click',e=>{const s=e.target.closest('[data-s]');if(s){$('inp').value=s.dataset.s;grow();$('inp').focus()}});
let stick=true;$('msgs').addEventListener('scroll',()=>{const el=$('msgs');stick=el.scrollHeight-el.scrollTop-el.clientHeight<80});
function scrollEnd(force){const el=$('msgs');if(force||stick)el.scrollTop=el.scrollHeight}

/* ---------- вложения ---------- */
let ATT=[];
$('clip').onclick=()=>$('fileIn').click();
$('fileIn').onchange=async e=>{for(const f of e.target.files)await addFile(f);e.target.value=''};
async function addFile(f){
  if(f.type.startsWith('image/')){if(f.size>8e6)return toast('Картинка больше 8 МБ');const data=await shrink(f);ATT.push({name:f.name,kind:'img',type:'image/jpeg',data});}
  else{if(f.size>400e3)return toast(f.name+': файл больше 400 КБ — слишком большой для чата');const t=await f.text();ATT.push({name:f.name,kind:'txt',data:t});}
  drawAtt();}
function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};im.onerror=()=>ok(r.result);im.src=r.result};r.readAsDataURL(f)})}
function drawAtt(){$('atts').innerHTML=ATT.map((a,i)=>`<span class="att">${a.kind==='img'?`<img src="${a.data}" alt="">`:'📄'}<span>${esc(a.name)}</span><button data-x="${i}" title="Убрать">✕</button></span>`).join('')}
$('atts').onclick=e=>{const x=e.target.closest('[data-x]');if(x){ATT.splice(+x.dataset.x,1);drawAtt()}};
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData||{}).files||[]];if(fs.length){e.preventDefault();fs.forEach(addFile)}});
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();[...e.dataTransfer.files].forEach(addFile)});

/* ---------- запрос к ИИ ---------- */
function sysPrompt(){const d=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric',weekday:'long'});
  return CFG.persona.replace(/^Тебя зовут [^.]+\./,'Тебя зовут '+(CFG.aname||'Тесса')+'.')+(CFG.uname?`\n\nТвоего собеседника зовут ${CFG.uname}.`:'')+(CFG.about?`\n\nО собеседнике:\n${CFG.about}`:'')+`\n\nСегодня ${d}.`+FILE_RULES;}
function apiMsgs(c){const out=[];let budget=90000;
  for(let i=c.msgs.length-1;i>=0;i--){const m=c.msgs[i];if(m.err)continue;let text=m.content||'';
    const imgs=[];for(const f of m.files||[]){if(f.kind==='txt'&&f.data!=null)text+=`\n\n[Приложен файл ${f.name}]\n\`\`\`\n${f.data}\n\`\`\``;else if(f.kind==='img'&&f.data)imgs.push(f.data);else text+=`\n\n[Был приложен файл ${f.name}, сейчас недоступен]`;}
    budget-=text.length;if(budget<0&&out.length)break;
    out.unshift(imgs.length&&m.role==='user'?{role:'user',content:[{type:'text',text:text||'(картинка)'},...imgs.map(u=>({type:'image_url',image_url:{url:u}}))]}:{role:m.role,content:text});}
  return [{role:'system',content:sysPrompt()},...out];}
let CTRL=null;
async function ask(c){
  if(!CFG.key||!CFG.model){openSet();toast('Вставь ключ и модель');return}
  const m={role:'assistant',content:''};c.msgs.push(m);drawMsgs();
  const node=$('inner').lastElementChild.querySelector('.b');node.innerHTML='<span class="dots"></span>';
  busy(true);CTRL=new AbortController();let last=0;
  const paint=()=>{node.innerHTML=md(m.content,true)||'<span class="dots"></span>';scrollEnd()};
  try{
    const r=await fetch(CFG.url.replace(/\/+$/,'')+'/chat/completions',{method:'POST',signal:CTRL.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},body:JSON.stringify({model:CFG.model,messages:apiMsgs({msgs:c.msgs.slice(0,-1)}),temperature:+CFG.temp,stream:true})});
    if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error(explain(r.status,t))}
    const ct=r.headers.get('content-type')||'';
    if(!r.body||ct.includes('application/json')){const j=await r.json();m.content=(j.choices&&j.choices[0]&&(j.choices[0].message||{}).content)||'';}
    else{const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;
        while((k=buf.indexOf('\n'))>=0){const line=buf.slice(0,k).trim();buf=buf.slice(k+1);if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')continue;
          let j=null;try{j=JSON.parse(d)}catch(_){continue}if(j.error)throw new Error(j.error.message||'Ошибка сервиса');const delta=j.choices&&j.choices[0]&&(j.choices[0].delta||j.choices[0].message);if(delta&&delta.content)m.content+=delta.content;}
        if(Date.now()-last>60){last=Date.now();paint()}}}
    if(!m.content)throw new Error('Модель вернула пустой ответ. Попробуй ещё раз или другую модель.');
  }catch(e){if(e.name==='AbortError'){if(!m.content)m.content='_(остановлено)_'}else{m.err=e.message==='Failed to fetch'?'Не получилось связаться с сервисом. Проверь интернет/VPN и адрес API в настройках.':e.message;}}
  CTRL=null;busy(false);
  if(c.title==='Новый чат'){const u=c.msgs.find(x=>x.role==='user');if(u)c.title=(u.content||u.files[0]?.name||'Чат').replace(/\s+/g,' ').slice(0,40)}
  c.ts=Date.now();save();drawMsgs();}
function explain(s,t){let msg='';try{const j=JSON.parse(t);msg=(j.error&&(j.error.message||j.error))||j.message||''}catch(e){msg=t.slice(0,300)}
  const hint=s===401?'Ключ не подходит — проверь, что скопировала его целиком.':s===402||/quota|balance|credit/i.test(msg)?'Похоже, на ключе закончились деньги.':s===404?'Неверная модель или адрес API.':s===429?'Слишком много запросов или лимит — подожди минуту.':s>=500?'У сервиса сбой — попробуй чуть позже.':'';
  return `Ошибка ${s}. ${hint}\n${msg}`.trim();}
function busy(b){const s=$('send');s.classList.toggle('stop',b);s.textContent=b?'■':'↑';s.title=b?'Остановить':'Отправить'}
function send(){if(CTRL){CTRL.abort();return}
  const t=$('inp').value.trim();if(!t&&!ATT.length)return;
  if(!cur())newChat();const c=cur();
  c.msgs.push({role:'user',content:t,files:ATT});ATT=[];drawAtt();$('inp').value='';grow();stick=true;ask(c);}
function regen(){const c=cur();if(!c||CTRL)return;if(c.msgs.length&&c.msgs[c.msgs.length-1].role==='assistant')c.msgs.pop();ask(c)}
$('send').onclick=send;
const touch=matchMedia('(pointer:coarse)').matches;if(touch)$('hint').textContent='Чтобы отправить — нажми ↑';
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!touch&&!e.isComposing){e.preventDefault();send()}});
function grow(){const t=$('inp');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,220)+'px'}
$('inp').addEventListener('input',grow);

/* ---------- настройки ---------- */
function openSet(){$('prov').value=MODELS[CFG.url]?CFG.url:'custom';$('url').value=CFG.url;$('urlF').hidden=!!MODELS[CFG.url];$('key').value=CFG.key;$('model').value=CFG.model;$('temp').value=CFG.temp;$('tv').textContent=CFG.temp;$('uname').value=CFG.uname;$('aname').value=CFG.aname||'';$('about').value=CFG.about;$('persona').value=CFG.persona;fillModels();$('tst').textContent='';$('setM').hidden=false;}
function fillModels(){const u=$('prov').value==='custom'?$('url').value:$('prov').value;$('mlist').innerHTML=(MODELS[u]||[]).map(x=>`<option value="${x}">`).join('')}
$('prov').onchange=()=>{const v=$('prov').value;$('urlF').hidden=v!=='custom';if(v!=='custom')$('url').value=v;fillModels()};
$('temp').oninput=()=>$('tv').textContent=$('temp').value;
function readSet(){return{url:($('prov').value==='custom'?$('url').value:$('prov').value).trim(),key:$('key').value.trim(),model:$('model').value.trim(),temp:+$('temp').value,uname:$('uname').value.trim(),aname:$('aname').value.trim()||'Тесса',about:$('about').value.trim(),persona:$('persona').value.trim()||PERSONA}}
$('setS').onclick=()=>{CFG=readSet();LS.set('mf_cfg',CFG);$('setM').hidden=true;toast('Сохранено');drawMsgs()};
$('setX').onclick=()=>$('setM').hidden=true;
$('setM').onclick=e=>{if(e.target.id==='setM')$('setM').hidden=true};
$('resetP').onclick=()=>{$('persona').value=PERSONA};
$('test').onclick=async()=>{const s=readSet();$('tst').textContent='Проверяю…';$('tst').style.color='var(--muted)';
  try{const r=await fetch(s.url.replace(/\/+$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.key},body:JSON.stringify({model:s.model,messages:[{role:'user',content:'Ответь одним словом: мяу'}],max_tokens:10})});
    const t=await r.text();if(!r.ok)throw new Error(explain(r.status,t));$('tst').textContent='✓ Работает!';$('tst').style.color='var(--ok)';}
  catch(e){$('tst').textContent='✕ '+(e.message==='Failed to fetch'?'Нет связи с сервисом (интернет/VPN/адрес)':e.message);$('tst').style.color='var(--bad)'}};
$('openSet').onclick=openSet;$('gear').onclick=openSet;

/* ---------- бэкап ---------- */
$('bk').onclick=()=>{const raw=localStorage.getItem('mf_chats')||'[]';const b=new Blob([raw],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='мяфля_чаты_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
$('rs').onclick=()=>$('rsf').click();
$('rsf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;const ids=new Set(CH.map(c=>c.id));let n=0;arr.forEach(c=>{if(c&&c.id&&Array.isArray(c.msgs)&&!ids.has(c.id)){CH.push(c);n++}});CH.sort((a,b)=>(b.ts||0)-(a.ts||0));save();drawList();toast('Добавлено чатов: '+n)}catch(x){toast('Это не файл с чатами')}e.target.value=''};

/* ---------- мобильное меню ---------- */
$('menu').onclick=()=>$('side').classList.toggle('open');
function closeSide(){$('side').classList.remove('open')}
$('msgs').addEventListener('click',closeSide);

drawList();drawMsgs();if(!CFG.key)setTimeout(openSet,300);
</script></body></html>
